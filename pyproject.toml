[project]
name = "helm"
version = "0.1.0"
description = "A terminal coding agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.14.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
helm = "helm.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helm"]
